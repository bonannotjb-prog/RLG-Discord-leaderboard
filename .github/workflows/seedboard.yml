name: Discord seederboard

on:
  schedule:
    # Twice an hour. The first run reads the whole history and takes several
    # minutes; later runs only recount the last three days.
    - cron: "12,42 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  actions: write          # lets the job start other jobs (see keepalive.py)
  contents: write         # lets the job save its totals back to the repo

concurrency:
  group: discord-seederboard
  cancel-in-progress: false

jobs:
  seederboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the picture tools
        run: pip install --quiet pillow fonttools

      - name: Count seeding time and update the board
        env:
          BATTLEMETRICS_TOKEN: ${{ secrets.BATTLEMETRICS_TOKEN }}
          DISCORD_SEEDBOARD_WEBHOOK_URL: ${{ secrets.DISCORD_SEEDBOARD_WEBHOOK_URL }}
          # BattleMetrics server ids: RLG Vanilla, then RLG Infantry.
          BM_SERVER_IDS: "41199298,41243237"
          SEEDBOARD_START: "2026-09-01"   # first day to count
          SEED_MIN: "1"
          SEED_MAX: "20"
          SEEDBOARD_TOP: "10"             # players per board, up to 15
        run: python seedboard.py

      - name: Save state (totals, message id and weekly heartbeat)
        run: |
          # Weekly heartbeat: this file changes once a week, so the repository always
          # has a recent commit and GitHub never pauses the schedule for inactivity.
          mkdir -p state
          date -u +%G-W%V > state/heartbeat-seedboard.txt
          python keepalive.py save "Update seeding totals"

      - name: Tell the admin channel if this job failed
        if: failure()
        env:
          # Optional secret. Nothing is sent until it exists.
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: python keepalive.py alert

      - name: Make sure the other jobs are running
        # GitHub's timer skips runs. Every job that does run checks on the rest:
        # it restarts the status job if it has stopped and starts any job whose
        # scheduled time passed with no run. See keepalive.py.
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python keepalive.py watchdog
