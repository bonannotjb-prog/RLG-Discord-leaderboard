name: Discord server status

# How this stays close to live: GitHub cannot schedule anything faster than every
# 5 minutes, so instead one job stays running for about 5.5 hours and updates the
# Discord message every 20 seconds. Each job starts the next one as its last step
# (keepalive.py); the schedule below is the backup. Because of the concurrency
# group, a new job waits in line while one is running and takes over within about
# a minute of the old one finishing.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:      # the "Run workflow" button
    inputs:
      run_minutes:
        description: "Minutes to run before handing over (leave empty for the normal 330)"
        type: string
        default: ""

permissions:
  actions: write          # lets the job start other jobs (see keepalive.py)
  contents: write         # lets the job save the Discord message id back to the repo

concurrency:
  group: discord-server-status
  cancel-in-progress: false

env:
  DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
  # One id per server, separated by commas. Each server gets its own panel in the
  # same message, in this order: [Vanilla] #1, then [INF] #2.
  WARCON_SERVER_IDS: "230a2cb3-e2af-450d-a1e1-515b08139d3d,2dd77c71-dbb6-49c4-95cf-78625467aba1"
  STATUS_INTERVAL: "20"        # seconds between checks (minimum 10)
  STATUS_RUN_MINUTES: ${{ inputs.run_minutes || '330' }}   # keep under the job's 6 hour limit

  # Seeding alerts. These stay switched off until the DISCORD_SEED_WEBHOOK_URL
  # secret exists.
  DISCORD_SEED_WEBHOOK_URL: ${{ secrets.DISCORD_SEED_WEBHOOK_URL }}
  SEED_ROLE_ID: "1574463353081045043"   # Discord role to ping (digits only)
  SEED_MIN: "1"
  SEED_MAX: "20"
  SEED_START_PLAYERS: "3"      # players needed before the role is pinged
  SEED_START_MINUTES: "3"      # how long they must stay before the ping
  SEED_PUSH_AT: "15"           # player count for the "final push" ping; 0 turns it off
  SEED_COOLDOWN_MINUTES: "90"  # shortest gap between pings for the same server
  SEED_ALERT_ON_DROP: "0"      # 1 = also ping when a full server falls back to 20 or fewer

  # Rank, join queue and seeding odds from WARDOGS Server List. Left out, without
  # any error, until the WARDOGSERVERLIST_API_KEY secret exists.
  WARDOGSERVERLIST_API_KEY: ${{ secrets.WARDOGSERVERLIST_API_KEY }}
  SEED_SHOW_ODDS_FROM: "50"    # add "good hour for it" to a seeding call at this percent or more; 0 = never
  SEED_HOLD_BELOW_PCT: "0"     # hold a seeding call when under this percent of seeds at this hour reach 20; 0 = never hold

  # Match recaps. These stay switched off until the DISCORD_RECAP_WEBHOOK_URL
  # secret exists.
  DISCORD_RECAP_WEBHOOK_URL: ${{ secrets.DISCORD_RECAP_WEBHOOK_URL }}
  RECAP_MIN_PLAYERS: "10"      # matches with fewer players than this get no recap

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the picture tools
        run: pip install --quiet pillow fonttools

      - name: Post or update the message once
        run: python status.py --once

      - name: Save state (message id and weekly heartbeat)
        run: |
          # Weekly heartbeat: this file changes once a week, so the repository always
          # has a recent commit and GitHub never pauses the schedule for inactivity.
          mkdir -p state
          date -u +%G-W%V > state/heartbeat-status.txt
          python keepalive.py save "Save Discord status message id"

      - name: Keep the message updated
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The ticker runs beside the loop. Every few minutes it starts any other
          # job whose scheduled time passed with no run (see keepalive.py).
          python keepalive.py ticker &
          ticker=$!
          code=0
          python status.py || code=$?
          kill "$ticker" 2>/dev/null || true
          exit "$code"

      - name: Tell the admin channel if this job failed
        if: failure()
        env:
          # Optional secret. Nothing is sent until it exists.
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: python keepalive.py alert

      - name: Start the next status job
        # Hands over straight away instead of waiting for GitHub's timer, which
        # left the board frozen for hours. Cancelling a run stops the chain.
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: python keepalive.py next
