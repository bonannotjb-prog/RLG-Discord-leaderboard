name: Discord weekly numbers

on:
  schedule:
    # Mondays at 14:23 UTC: 9:23 AM Eastern, 7:23 AM Phoenix. A second try two
    # hours later covers a skipped run; the job never posts the same week twice.
    - cron: "23 14 * * 1"
    - cron: "23 16 * * 1"
  workflow_dispatch:      # the "Run workflow" button
    inputs:
      force:
        description: "Post even if this week's numbers were already posted"
        type: boolean
        default: false

permissions:
  actions: write          # lets the job start other jobs (see keepalive.py)
  contents: write         # lets the job record which week it posted

concurrency:
  group: discord-weekly-numbers
  cancel-in-progress: false

jobs:
  numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the picture tools
        run: pip install --quiet pillow fonttools

      - name: Count the weekly numbers and post them
        env:
          BATTLEMETRICS_TOKEN: ${{ secrets.BATTLEMETRICS_TOKEN }}
          DISCORD_NUMBERS_WEBHOOK_URL: ${{ secrets.DISCORD_NUMBERS_WEBHOOK_URL }}
          # BattleMetrics server ids: RLG Vanilla, then RLG Infantry.
          BM_SERVER_IDS: "41199298,41243237"
          # Optional: adds the rank and best-seeding-hours pictures from WARDOGS Server List.
          WARDOGSERVERLIST_API_KEY: ${{ secrets.WARDOGSERVERLIST_API_KEY }}
          # WarCon server ids (Vanilla, then Infantry), used to find each server on Server List.
          WARCON_SERVER_IDS: "230a2cb3-e2af-450d-a1e1-515b08139d3d,2dd77c71-dbb6-49c4-95cf-78625467aba1"
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python weekly_numbers.py

      - name: Save state (week posted and weekly heartbeat)
        run: |
          # Weekly heartbeat: this file changes once a week, so the repository always
          # has a recent commit and GitHub never pauses the schedule for inactivity.
          mkdir -p state
          date -u +%G-W%V > state/heartbeat-numbers.txt
          python keepalive.py save "Save weekly numbers state"

      - name: Tell the admin channel if this job failed
        if: failure()
        env:
          # Optional secret. Nothing is sent until it exists.
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: python keepalive.py alert

      - name: Make sure the other jobs are running
        # GitHub's timer skips runs. Every job that does run checks on the rest:
        # it restarts the status job if it has stopped and starts any job whose
        # scheduled time passed with no run. See keepalive.py.
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python keepalive.py watchdog
