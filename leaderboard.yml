name: Discord leaderboard

on:
  schedule:
    # Every 15 minutes, off the top of the hour (GitHub runs these late when busy).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write         # lets the job save the Discord message id back to the repo

concurrency:
  group: discord-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the picture tools
        run: pip install --quiet pillow fonttools

      - name: Update the leaderboard message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # One id per server, separated by commas. Each server gets its own panel
          # in the same message, in this order. First is [RLG] Redline Gaming
          # [Vanilla] #1; second is the other RLG server.
          WARCON_SERVER_IDS: "230a2cb3-e2af-450d-a1e1-515b08139d3d,2dd77c71-dbb6-49c4-95cf-78625467aba1"
          LB_RANGE: "all"          # current | 7d | 30d | 90d | all
          LB_SORT: "kills"         # kills | kd | perHour | playtime | seeded | matches | wins | winRate | cash
          LB_MIN_MINUTES: "60"
          LB_TOP: "10"             # players per server, up to 15
        run: python leaderboard.py

      - name: Save state (message id and weekly heartbeat)
        run: |
          # Weekly heartbeat: this file changes once a week, so the repository always
          # has a recent commit and GitHub never pauses the schedule for inactivity.
          mkdir -p state
          date -u +%G-W%V > state/heartbeat-leaderboard.txt
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "Save leaderboard state"
            git pull --rebase
            git push
          fi
