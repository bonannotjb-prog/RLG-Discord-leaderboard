name: Discord leaderboard

on:
  schedule:
    # Every 15 minutes, off the top of the hour (GitHub runs these late when busy).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write         # lets the job save the Discord message id back to the repo

concurrency:
  group: discord-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update the leaderboard message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # One id per server, separated by commas. Each server gets its own panel
          # in the same message. This one is [RLG] Redline Gaming [Vanilla] #1.
          WARCON_SERVER_IDS: "230a2cb3-e2af-450d-a1e1-515b08139d3d"
          LB_RANGE: "current"      # current | 7d | 30d | 90d | all
          LB_SORT: "kills"         # kills | kd | perHour | playtime | seeded | matches | wins | winRate | cash
          LB_MIN_MINUTES: "60"
          LB_TOP: "15"
        run: python leaderboard.py

      - name: Save the message id (first run only)
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "Save Discord leaderboard message id"
            git push
          fi
